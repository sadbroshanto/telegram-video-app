<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Video App</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag -->
    <script src="//monetag.com/tag.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        .app {
            max-width: 500px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .video-card {
            background: #1f2937;
            padding: 15px;
            border-radius: 15px;
            margin-top: 25px;
        }

        .thumbnail {
            height: 200px;
            background: #374151;
            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 60px;
        }

        button {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 10px;

            background: #229ED9;
            color: white;

            font-size: 17px;
            font-weight: bold;
        }

        #videoArea {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="app">

    <h1>🎬 My Video App</h1>

    <p id="welcome">Welcome!</p>

    <div class="video-card">

        <div class="thumbnail">
            🎥
        </div>

        <h2>Video 1</h2>

        <p>
            ভিডিও দেখতে আগে বিজ্ঞাপন দেখুন।
        </p>

        <button onclick="watchAd()">
            ▶ Watch & Unlock
        </button>

        <div id="videoArea">
            <p>🔓 ভিডিও আনলক হয়েছে!</p>

            <!-- এখানে পরে TeraBox video যোগ করব -->

            <p>
                এখানে আপনার ভিডিও Play হবে।
            </p>
        </div>

    </div>

</div>

<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    if (user) {
        document.getElementById("welcome").innerText =
            "স্বাগতম, " + user.first_name + "!";
    }


    function watchAd() {

        show_11609578().then(() => {

            // Ad সম্পূর্ণ দেখা হয়েছে

            document.getElementById("videoArea").style.display = "block";

            alert("Ad দেখা হয়েছে! ভিডিও আনলক হয়েছে।");

        }).catch((error) => {

            console.log("Ad error:", error);

            alert("Ad চালু করা যায়নি। আবার চেষ্টা করুন।");

        });

    }

</script>

</body>
</html>
